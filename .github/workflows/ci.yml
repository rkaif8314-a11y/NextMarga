name: NextMarga CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nextmarga-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # The checked-in lockfile currently predates the Supabase dependency used by the app.
        # Allow Bun to reconcile the lock during CI so typecheck/build can validate the actual package manifest.
        run: bun install --no-save

      - name: Type check
        run: bun run lint

      - name: Production build
        run: bun run build
